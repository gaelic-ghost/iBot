name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    container:
      image: swift:6.3-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Verify Swift formatting
        run: swift format lint --recursive --strict Package.swift Sources Tests
      - name: Build and test iBot
        run: swift test

  container:
    name: container
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: false
          push: false
          tags: ghcr.io/gaelic-ghost/ibot:ci
