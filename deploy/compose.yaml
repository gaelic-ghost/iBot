services:
  birdbot:
    image: ghcr.io/gaelic-ghost/birdbot:${IMAGE_TAG:?Set IMAGE_TAG to an immutable published image tag}
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
